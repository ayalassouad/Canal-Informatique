services:
  - type: web
    name: canal-informatique-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: OLLAMA_URL
        value: http://localhost:11434
      - key: OLLAMA_MODEL
        value: qwen2.5:3b
      - key: RESEND_API_KEY
        sync: false
      - key: TARGET_EMAIL
        sync: false

  - type: static
    name: canal-informatique-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://canal-informatique-backend.onrender.com
